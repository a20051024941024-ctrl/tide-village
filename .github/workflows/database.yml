# 資料庫設定自動套用：supabase/ 裡的 .sql 有變動並推上 GitHub 時，自動在 Supabase 執行
# 需要在 GitHub 儲存庫 Settings → Secrets and variables → Actions 新增 SUPABASE_DB_URL（Supabase 的資料庫連線網址）
name: 套用資料庫設定
on:
  push:
    branches: [main]
    paths: ['supabase/**.sql']
  workflow_dispatch: {}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: 依序執行 supabase/*.sql（每份都可以重複執行）
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "還沒設定 SUPABASE_DB_URL，略過"; exit 0; fi
          for f in supabase/schema.sql $(ls supabase/[0-9][0-9][0-9]_*.sql | sort); do
            echo "== 執行 $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

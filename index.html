<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>潮汐釣魚村</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="釣魚村">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="和朋友一起在 3D 小島上釣魚、聊天、收集魚種。開房輸入 5 個字母的代碼就能一起玩。">
<meta property="og:title" content="潮汐釣魚村">
<meta property="og:description" content="和朋友一起在 3D 小島上釣魚、聊天、收集魚種。">
<meta property="og:image" content="icons/icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f89c7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<canvas id="c" tabindex="0" aria-label="潮汐釣魚村 3D 場景"></canvas>
<div id="labels"></div>

<div id="top">
  <div id="brand" class="panel">
    <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 16c2 1.6 4 1.6 6 0s4-1.6 6 0 4 1.6 6 0"/><path d="M15 3v8a3 3 0 1 1-3-3"/></svg></div>
    <div><h1>潮汐釣魚村</h1><div id="online"><span class="dot"></span><span id="onlineTxt">單人模式</span><span id="clock"></span><span id="buffChip" hidden></span><span id="coins" title="金幣">🪙 <b id="coinTxt">0</b></span></div></div>
  </div>
  <div id="menu">
    <button class="mbtn panel" data-tab="map" aria-label="地圖"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>地圖</span></button>
    <button class="mbtn panel" data-tab="dex" aria-label="圖鑑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6"/></svg><span>圖鑑</span></button>
    <button class="mbtn panel" data-tab="rank" aria-label="排行榜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span>排行榜</span></button>
    <button class="mbtn panel" data-tab="tank" aria-label="魚缸"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 12c1.5-1.5 3.5-1.5 5 0-1.5 1.5-3.5 1.5-5 0zM13 12l2-1.5v3z"/></svg><span>魚缸</span></button>
    <button class="mbtn panel" data-tab="island" aria-label="小島"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19c3-2 6-2 9 0s6 2 9 0"/><path d="M5 16c2-2.5 5-3 7-3s5 .5 7 3"/><path d="M12 13V6"/><path d="M12 6c-2-2-5-1.5-6 0M12 6c2-2 5-1.5 6 0M12 6c-.5-2-2-3-4-3M12 6c.5-2 2-3 4-3"/></svg><span>小島</span></button>
    <button class="mbtn panel" data-tab="people" aria-label="玩家"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5 5 0 0 1 3.5 6"/></svg><span>玩家</span></button>
    <button class="mbtn panel" data-tab="style" aria-label="造型"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18M6 15c0-4 2.7-7 6-7s6 3 6 7"/><path d="M12 8V5"/></svg><span>造型</span></button>
    <button class="mbtn panel" id="photoBtn" aria-label="拍照"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>拍照</span></button>
    <button class="mbtn panel" id="fsBtn" aria-label="全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="mbtn panel" id="musicBtn" aria-label="音樂開關"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    <button class="mbtn panel" id="soundBtn" aria-label="音效開關"><svg id="soundIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></button>
  </div>
</div>

<div id="spotCard" class="panel" hidden><div class="t"></div><div class="s"></div><div class="fl"></div></div>
<div id="ticker" aria-live="polite"></div>
<div id="toasts"></div>
<div id="bigMsg" hidden></div>

<div id="chargeHud" class="panel" hidden><div class="t">蓄力中，放開拋竿</div><div class="bar"><i id="chargeFill"></i></div></div>
<div id="fishHud" class="panel" hidden>
  <div class="hdr"><span id="fhName">有魚上鉤了！</span><small id="fhHint">按住拉線，放開卸力</small></div>
  <div class="barlbl"><span>線的拉力</span><span id="fhT">保持在綠色區</span></div>
  <div class="bar tension" id="tBar"><span class="zone"></span><i id="tFill"></i></div>
  <div class="barlbl"><span>收線進度</span><span id="fhP"></span></div>
  <div class="bar progress"><i id="pFill"></i></div>
</div>

<div id="joyZone" aria-hidden="true"></div>
<div id="joy" aria-hidden="true"><div class="knob"></div></div>
<div id="chat">
  <div id="log" aria-live="polite"></div>
  <form id="chatForm" class="panel" autocomplete="off">
    <input id="chatIn" maxlength="120" placeholder="按 Enter 跟大家聊天…" aria-label="聊天訊息">
    <button id="chatSend" type="submit">送出</button>
  </form>
</div>


<div id="showPick" class="panel" hidden><div class="sphead"><b>炫耀哪條魚？</b><button class="spx" aria-label="關閉">✕</button></div><div class="splist"></div></div>
<div id="actWrap">
  <div id="emotes">
    <button class="panel" id="chatToggle" aria-label="聊天">💬</button>
    <button class="panel" data-emote="wave" aria-label="揮手">👋</button>
    <button class="panel" id="showBtn" aria-label="炫耀魚">🐟</button>
    <button class="panel" data-emote="wow" aria-label="驚嘆">😮</button>
  </div>
  <button id="boatBtn" class="panel" hidden>上船</button>
  <div id="actRow"><button id="jumpBtn" class="panel" aria-label="跳">跳</button><button id="act" class="idle" aria-label="釣魚動作">走到釣點</button></div>
</div>

<div id="hint" class="panel"><span id="hintTxt">WASD 移動 · 拖曳滑鼠轉視角 · 空白鍵跳（在釣點則是拋竿）· 走進發光圈後按住空白鍵拋竿</span><button id="hintX">知道了</button></div>

<div id="photoUI" hidden>
  <div class="ptop"><span class="phint" id="pHint">拖曳轉動視角・雙指縮放</span><button class="pchip" id="pSelfie">自拍</button><button class="pchip on" id="pNames">名字</button><button class="pchip" id="pExit">完成</button></div>
  <div class="pleft"><button data-pemote="wave" aria-label="揮手">👋</button><button data-pemote="fish" aria-label="炫耀">🐟</button><button data-pemote="wow" aria-label="驚嘆">😮</button></div>
  <button id="shutter" aria-label="按快門"></button>
</div>
<div id="flashFx"></div>
<div id="fadeFx"></div>
<div id="photoView" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-label="照片">
    <img id="photoImg" alt="剛拍的照片">
    <div class="row"><button class="main" id="pSave">存到手機</button><button id="pShare" hidden>分享</button><button id="pAgain">再拍一張</button></div>
  </div>
</div>
<div id="catchCard" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ccName">
    <canvas id="ccCanvas" width="440" height="280"></canvas>
    <div class="badges" id="ccBadges"></div>
    <div class="nm" id="ccName"></div>
    <div class="w" id="ccW"></div>
    <div class="d" id="ccDesc"></div>
    <button class="pbtn" id="ccOk">放進魚缸</button>
  </div>
</div>

<div id="sheet" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-label="選單">
    <header>
      <div id="tabs" role="tablist">
        <button role="tab" data-tab="map">地圖</button>
        <button role="tab" data-tab="dex">圖鑑</button>
        <button role="tab" data-tab="rank">排行榜</button>
        <button role="tab" data-tab="tank">魚缸</button>
        <button role="tab" data-tab="island">小島</button>
        <button role="tab" data-tab="people">玩家</button>
        <button role="tab" data-tab="style">造型</button>
        <button role="tab" data-tab="help">玩法</button>
      </div>
      <button id="closeSheet" aria-label="關閉"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="rotate" role="dialog" aria-label="請轉成橫向">
  <div class="ph" aria-hidden="true"></div>
  <h2>點一下，轉成橫向開始玩</h2>
  <p>潮汐釣魚村是橫向遊戲，左手搖桿、右手拋竿最順手。點畫面任何地方就會自動全螢幕、轉成橫向。</p>
  <div class="row"><button id="rotFull">開始玩</button><button id="rotSkip">先用直向</button></div>
  <p style="font-size:12px;opacity:.75;max-width:30ch">小技巧：用瀏覽器選單「加到主畫面」，之後從主畫面圖示打開就會直接橫向。</p>
</div>

<script src="js/peer-room.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
} }
</script>
<script>
// 15 秒內 3D 引擎還沒開始，就告訴玩家怎麼辦（通常是網路或 CDN 問題）
setTimeout(function(){ if (!window.__gameStarted){ var d = document.createElement('div'); d.className = 'panel'; d.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px;max-width:320px;text-align:center;z-index:99'; d.textContent = '遊戲載入太久了。請確認網路連線後重新整理；如果是在 LINE 或 Messenger 裡打開，改用 Chrome 開啟試試。'; document.body.appendChild(d); } }, 15000);
</script>
<script type="module" src="js/game.js"></script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>

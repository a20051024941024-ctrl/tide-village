<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>潮汐釣魚村</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="釣魚村">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="和朋友一起在 3D 小島上釣魚、聊天、收集魚種。開房輸入 5 個字母的代碼就能一起玩。">
<meta property="og:title" content="潮汐釣魚村">
<meta property="og:description" content="和朋友一起在 3D 小島上釣魚、聊天、收集魚種。">
<meta property="og:image" content="icons/icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f89c7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen 3D village; HUD pinned to the four corners, one modal sheet for menus. Single committed look (sunny island), no dark variant. */
:root{
  --ink:#18334a;
  --ink-soft:#4a6377;
  --paper:#f6fcfb;
  --paper-2:#e2f1ee;
  --line:rgba(24,51,74,.14);
  --coral:#f17b6d;
  --gold:#ffd36a;
  --sea:#2f89c7;
  --mint:#3fbf9d;
  --r-common:#5aa88f;
  --r-rare:#e59a2f;
  --r-legend:#9b5de5;
  --danger:#e0533f;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --gt:calc(env(safe-area-inset-top, 0px) + 12px);
  --gb:calc(env(safe-area-inset-bottom, 0px) + 16px);
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:#8bd8e8;color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-left:var(--gl);padding-right:var(--gr)}
#c{position:fixed;inset:0;width:100vw;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.panel{background:rgba(246,252,251,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.7);box-shadow:0 6px 20px rgba(24,51,74,.16);border-radius:16px}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--f-display);font-size:13px;color:var(--ink);background:rgba(255,255,255,.82);padding:3px 9px;border-radius:999px;transform:translate(-50%,-100%);box-shadow:0 2px 6px rgba(24,51,74,.15);will-change:transform}
.lbl.spot{border:2px solid var(--c,#fff)}
.lbl small{color:var(--ink-soft);font-family:var(--f-body);font-size:11px;margin-left:4px}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-100%);will-change:transform}
.tag .nm{font-size:12px;font-weight:700;color:#fff;background:rgba(24,51,74,.78);padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag .nm.me{background:var(--coral)}
.tag .nm.npc{background:rgba(90,120,100,.82);font-weight:500}
.tag .bub{max-width:200px;font-size:13px;line-height:1.35;background:#fff;color:var(--ink);padding:6px 10px;border-radius:12px;box-shadow:0 3px 10px rgba(24,51,74,.2);white-space:normal;word-break:break-word;text-align:center;position:relative}
.tag .bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.tag .bub.emote{font-size:22px;padding:4px 10px}
.tag .bub.alert{background:var(--gold);font-family:var(--f-display);font-size:22px;color:var(--ink)}
.tag .bub.alert::after{border-top-color:var(--gold)}

/* top bar */
#top{position:fixed;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 10px}
#brand .mark{width:34px;height:34px;border-radius:10px;background:var(--sea);display:grid;place-items:center;flex:none}
#brand h1{font-family:var(--f-display);font-size:18px;margin:0;line-height:1.1;font-weight:400;letter-spacing:.04em}
#online{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-top:2px}
#online .dot{width:8px;height:8px;border-radius:50%;background:#9fb3bf}
#online.live .dot{background:#38c172;box-shadow:0 0 0 3px rgba(56,193,114,.2)}
#menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbtn{display:flex;align-items:center;gap:6px;padding:9px 13px;font-size:14px;font-weight:500}
.mbtn svg{width:18px;height:18px;flex:none}
@media (max-width:640px){.mbtn span{display:none}.mbtn{padding:10px}#brand h1{font-size:16px}}

/* spot card */
#spotCard{position:fixed;left:50%;top:calc(var(--gt) + 64px);transform:translateX(-50%);padding:10px 16px;text-align:center;min-width:220px;max-width:calc(100vw - 32px);pointer-events:none;transition:opacity .25s}
#spotCard[hidden]{display:none!important}
#spotCard .t{font-family:var(--f-display);font-size:17px}
#spotCard .s{font-size:12px;color:var(--ink-soft);margin-top:2px}
#spotCard .fl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink);white-space:nowrap}
.chip.r-常見{background:rgba(90,168,143,.16);color:#2f7a63}
.chip.r-稀有{background:rgba(229,154,47,.18);color:#9a5f0c}
.chip.r-傳說{background:rgba(155,93,229,.16);color:#6a2fb5}

/* fishing HUD */
#fishHud{position:fixed;left:50%;bottom:calc(var(--gb) + 150px);transform:translateX(-50%);width:min(340px,calc(100vw - 32px));padding:12px 14px;pointer-events:none}
#fishHud .hdr{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:16px;margin-bottom:8px}
#fishHud .hdr small{font-family:var(--f-body);font-size:12px;color:var(--ink-soft)}
.bar{position:relative;height:14px;border-radius:999px;background:var(--paper-2);overflow:hidden;margin-top:4px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--sea);width:0}
.bar .zone{position:absolute;top:0;bottom:0;left:35%;width:45%;background:rgba(63,191,157,.25);border-left:2px solid rgba(63,191,157,.7);border-right:2px solid rgba(63,191,157,.7)}
.bar.tension i{background:var(--mint)}
.bar.tension.hot i{background:var(--danger)}
.bar.progress i{background:var(--gold)}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:8px}
#chargeHud{position:fixed;left:50%;bottom:calc(var(--gb) + 150px);transform:translateX(-50%);width:min(260px,calc(100vw - 32px));padding:10px 14px;pointer-events:none;text-align:center}
#chargeHud .t{font-family:var(--f-display);font-size:15px;margin-bottom:6px}
#chargeHud .bar i{background:linear-gradient(90deg,var(--mint),var(--gold),var(--coral))}
#bigMsg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(30px,8vw,54px);color:#fff;text-shadow:0 3px 0 var(--ink),0 0 18px rgba(24,51,74,.5);pointer-events:none;white-space:nowrap;letter-spacing:.06em}
#bigMsg.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}60%{transform:translate(-50%,-50%) scale(1.12);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}

/* action cluster */
#actWrap{position:fixed;right:var(--gr);bottom:var(--gb);display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#emotes{display:flex;gap:8px}
#emotes button{width:44px;height:44px;border-radius:50%;font-size:20px;display:grid;place-items:center}
#act{width:112px;height:112px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--f-display);font-size:20px;box-shadow:0 6px 0 #d9a93a,0 10px 24px rgba(24,51,74,.25);border:4px solid #fff;transition:transform .08s,box-shadow .08s,background .2s;touch-action:none;line-height:1.15;padding:6px}
#act small{display:block;font-family:var(--f-body);font-size:11px;color:var(--ink-soft);margin-top:2px}
#act:active,#act.down{transform:translateY(4px);box-shadow:0 2px 0 #d9a93a,0 6px 14px rgba(24,51,74,.25)}
#act.idle{background:#e9f1ef;box-shadow:0 6px 0 #c3d3cf,0 10px 24px rgba(24,51,74,.15);color:var(--ink-soft);font-size:14px}
#act.bite{background:var(--coral);color:#fff;animation:pulse .4s infinite alternate}
#act.bite small{color:#fff}
@keyframes pulse{to{transform:scale(1.08)}}

/* chat */
#chat{position:fixed;left:var(--gl);bottom:var(--gb);width:min(360px,calc(100vw - 180px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#log{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:hidden;justify-content:flex-end;mask-image:linear-gradient(to bottom,transparent,#000 24px)}
#log .m{font-size:13px;line-height:1.4;background:rgba(24,51,74,.55);color:#fff;padding:4px 10px;border-radius:10px;align-self:flex-start;max-width:100%;word-break:break-word;transition:opacity .6s}
#log .m b{font-weight:700;margin-right:6px;color:var(--gold)}
#log .m.sys{background:rgba(255,255,255,.75);color:var(--ink)}
#log .m.sys b{color:var(--coral)}
#log .m.fade{opacity:0}
#chatForm{display:flex;gap:6px;pointer-events:auto;padding:5px}
#chatIn{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;padding:6px 8px;color:var(--ink);-webkit-user-select:text;user-select:text}
#chatIn::placeholder{color:var(--ink-soft)}
#chatSend{padding:6px 12px;border-radius:10px;background:var(--sea);color:#fff;font-weight:700;font-size:13px}
#chatSend:disabled{opacity:.4}

/* joystick */
/* 浮動搖桿：左半邊螢幕任何地方按下，搖桿就出現在手指底下 */
#joyZone{position:fixed;left:0;top:calc(var(--gt) + 56px);bottom:0;width:46vw;touch-action:none;display:none}
body.touch #joyZone{display:block}
#joy{position:fixed;left:var(--gl);bottom:var(--gb);width:168px;height:168px;border-radius:50%;background:rgba(255,255,255,.32);border:3px solid rgba(255,255,255,.75);pointer-events:none;display:none;transition:opacity .2s}
#joy .knob{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(24,51,74,.25)}
#joy.active{background:rgba(255,255,255,.42);transition:none}
body.touch #joy{display:block}
body.touch #chat{bottom:calc(var(--gb) + 184px);width:min(300px,calc(100vw - 32px))}
body.touch #chatForm{display:none}
body.touch.chatting #chatForm{display:flex}
#chatToggle{display:none}
body.touch #chatToggle{display:grid}

/* toasts */
#toasts{position:fixed;top:calc(var(--gt) + 64px);right:var(--gr);display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:min(320px,calc(100vw - 32px))}
.toast{padding:9px 13px;font-size:13px;line-height:1.4;animation:tin .3s ease-out}
.toast b{font-weight:700}
.toast.out{opacity:0;transform:translateX(20px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}

/* catch card */
#catchCard{position:fixed;inset:0;display:grid;place-items:center;background:rgba(24,51,74,.35);padding-left:var(--gl);padding-right:var(--gr);z-index:20}
#catchCard .card{width:min(340px,100%);padding:22px 20px 18px;text-align:center;background:var(--paper);border-radius:22px;box-shadow:0 20px 50px rgba(24,51,74,.35);animation:pop2 .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop2{from{transform:scale(.7);opacity:0}}
#catchCard canvas{width:220px;height:140px;max-width:100%}
#catchCard .nm{font-family:var(--f-display);font-size:28px;margin-top:4px}
#catchCard .w{font-family:var(--f-display);font-size:40px;color:var(--sea);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
#catchCard .w small{font-size:18px;margin-left:4px;color:var(--ink-soft)}
#catchCard .d{font-size:13px;color:var(--ink-soft);margin:10px auto 0;max-width:28ch;line-height:1.55}
#catchCard .badges{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--coral);color:#fff}
.badge.new{background:var(--sea)}
.pbtn{margin-top:16px;width:100%;padding:12px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(24,51,74,.3);padding-left:var(--gl);padding-right:var(--gr);padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px)}
#sheet .box{width:min(620px,100%);max-height:min(640px,100%);display:flex;flex-direction:column;background:var(--paper);border-radius:22px;box-shadow:0 20px 50px rgba(24,51,74,.3);overflow:hidden}
#sheet header{display:flex;align-items:center;gap:6px;padding:12px 12px 0 16px}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
#tabs button{padding:8px 12px;border-radius:10px;font-size:14px;white-space:nowrap;color:var(--ink-soft)}
#tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
#closeSheet{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
#closeSheet:hover{background:var(--paper-2)}
#sheetBody{padding:14px 16px 18px;overflow:auto;min-height:0}
.sub{font-size:12px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.dex .it{border:1px solid var(--line);border-radius:14px;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff}
.dex .it canvas{width:96px;height:60px}
.dex .it .n{font-family:var(--f-display);font-size:15px}
.dex .it .meta{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dex .it.lock .n{color:#9fb3bf}
.dexhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;font-family:var(--f-display);font-size:16px}
.dexhead:first-child{margin-top:0}
.dexhead small{font-family:var(--f-body);font-size:12px;color:var(--ink-soft)}
.seg{display:inline-flex;background:var(--paper-2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(24,51,74,.15);font-weight:700}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.rank li.me{border-color:var(--coral);background:#fff5f3}
.rank .pos{font-family:var(--f-display);font-size:17px;text-align:center;color:var(--ink-soft)}
.rank li:nth-child(1) .pos{color:#d19a0f}
.rank .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rank .who small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft)}
.rank .val{font-variant-numeric:tabular-nums;font-weight:700}
.empty{padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.6;background:#fff;border-radius:14px;border:1px dashed var(--line)}
.tank{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tank li{display:flex;gap:10px;align-items:center;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:12px}
.tank canvas{width:56px;height:36px;flex:none}
.tank .n{font-weight:500;font-size:14px}
.tank .meta{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.people li{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.people .sw{width:14px;height:14px;border-radius:50%;flex:none}
.people .st{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700;font-size:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.txt{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text;max-width:260px}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
.kbd kbd{font-family:var(--f-body);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:12px;justify-self:start}

#hint{position:fixed;left:50%;bottom:calc(var(--gb) + 6px);transform:translateX(-50%);padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 300px)}
#hint button{font-size:12px;color:var(--ink-soft);text-decoration:underline}
body.touch #hint{bottom:auto;top:calc(var(--gt) + 64px);max-width:calc(100vw - 32px)}
@media (max-width:820px){body:not(.touch) #hint{display:none}}
/* ---- landscape phone layout (short screens) ---- */
@media (orientation:landscape) and (max-height:540px){
  :root{--gt:calc(env(safe-area-inset-top,0px) + 8px);--gb:calc(env(safe-area-inset-bottom,0px) + 10px)}
  #brand{padding:5px 10px 5px 6px;gap:8px}
  #brand .mark{width:28px;height:28px;border-radius:8px}
  #brand h1{font-size:15px}
  #online{font-size:11px;margin-top:0}
  .mbtn{padding:8px}
  .mbtn span{display:none}
  .mbtn svg{width:17px;height:17px}
  #spotCard{top:calc(var(--gt) + 50px);padding:5px 12px;min-width:0;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 260px)}
  #spotCard .fl{margin-top:0;flex-wrap:nowrap;overflow:hidden}
  #spotCard .t{white-space:nowrap}
  #spotCard .t{font-size:15px}
  #spotCard .s{display:none}
  #spotCard .fl{margin-top:4px}
  #toasts{top:calc(var(--gt) + 46px)}
  #actWrap{gap:8px}
  #emotes{gap:6px}
  #emotes button{width:38px;height:38px;font-size:17px}
  #act{width:88px;height:88px;font-size:17px;border-width:3px}
  #act.idle{font-size:13px}
  #joy{width:150px;height:150px}
  #joy .knob{width:64px;height:64px;margin:-32px 0 0 -32px}
  #fishHud,#chargeHud{bottom:var(--gb);width:min(300px,calc(100vw - 300px));padding:8px 12px}
  #fishHud .hdr{font-size:14px;margin-bottom:2px}
  .barlbl{margin-top:4px}
  .bar{height:11px}
  #bigMsg{top:34%}
  body.touch #chat{bottom:calc(var(--gb) + 164px);width:min(260px,calc(50vw - 60px))}
  #log{max-height:calc(100vh - 330px);min-height:0}
  #log .m{font-size:12px;padding:3px 8px}
  body.touch.chatting #chatForm{position:fixed;left:50%;top:var(--gt);transform:translateX(-50%);width:min(420px,calc(100vw - 32px));z-index:15}

   對外提供的用法：connected() emit(topic,data) on(topic,fn) presence(obj) onPeers(fn) onConnection(fn) leave() code */

function inWater(x, z){ for (const w of waters) if (x > w.x0 && x < w.x1 && z > w.z0 && z < w.z1) return true; return false; }
function deckAt(x, z){ for (const d of decks) if (x > d.x0 && x < d.x1 && z > d.z0 && z < d.z1) return d; return null; }
function groundHeight(x, z){ const d = deckAt(x, z); return d ? d.y : 0; }
function walkable(x, z){ if (Math.abs(x) > 35 || Math.abs(z) > 35) return false; if (deckAt(x, z)) return true; return !inWater(x, z); }
function blocked(x, z, r){
  for (const c of colliders){
    if (c.t === 'b'){ if (Math.abs(x - c.x) < c.hw + r && Math.abs(z - c.z) < c.hd + r) return true; }
    else if (Math.hypot(x - c.x, z - c.z) < c.r + r) return true;
  }
  return false;
}

function makeFish(color, scale){
  const fish = new THREE.Group(); fish.scale.setScalar(scale || 1);
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 10), mat(color, 0.4)); body.scale.set(1.45, 0.68, 0.62);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.62, 3), mat(color, 0.55)); tail.rotation.z = Math.PI/2; tail.position.x = -0.65;
  const fin = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.42, 3), mat('#fff4d2', 0.65)); fin.rotation.z = -Math.PI/2; fin.position.set(0.05, 0.3, 0);
  const eyeM = mat('#173247', 0.25);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), eyeM); eye.position.set(0.47, 0.13, -0.23);
  const eye2 = eye.clone(); eye2.position.z = 0.23;
  fish.add(body, tail, fin, eye, eye2); fish.userData.tail = tail;
  fish.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return fish;
}

class Fisher {
  constructor(opts){
    this.av = makeAvatar(opts.shirt, opts.hat); scene.add(this.av.g);
    this.bob = makeBobber(); this.line = makeLine();
    this.pos = this.av.g.position; this.rot = 0; this.walk = 0; this.speed = 0;
    this.fishing = false; this.bobPos = new THREE.Vector3(); this.dip = 0; this.bend = 0; this.flying = null;
    this.tag = document.createElement('div'); this.tag.className = 'tag';
    this.bub = document.createElement('div'); this.bub.className = 'bub'; this.bub.hidden = true;
    this.nm = document.createElement('div'); this.nm.className = 'nm' + (opts.kind ? ' ' + opts.kind : '');
    this.nm.textContent = opts.name || '';
    this.tag.append(this.bub, this.nm); labelsEl.appendChild(this.tag);
    this.bubUntil = 0;
  }
  setLook(shirt, hat){ this.av.shirtM.color.set(shirt); this.av.hatM.color.set(hat); }
  setName(n){ if (this.nm.textContent !== n) this.nm.textContent = n; }
  say(text, cls, secs){ this.bub.className = 'bub' + (cls ? ' ' + cls : ''); this.bub.textContent = text; this.bub.hidden = false; this.bubUntil = now() + (secs || 5); }
  dispose(){ scene.remove(this.av.g, this.bob, this.line); this.tag.remove(); }
  update(dt, t){
    const a = this.av;
    this.walk += dt * this.speed * 2.2;
    const sw = Math.sin(this.walk) * Math.min(1, this.speed / 3) * 0.7;
    a.legL.rotation.x = sw; a.legR.rotation.x = -sw;
    a.g.rotation.y = this.rot;
    a.rod.visible = this.fishing;
    if (this.fishing){
      a.armR.rotation.x = -1.0 - this.bend * 0.3; a.armL.rotation.x = -0.7 - this.bend*0.2;
      a.rod.rotation.x = 0.95 - this.bend * 0.45 + Math.sin(t*9) * this.bend * 0.04;
    } else { a.armL.rotation.x = -sw * 0.8; a.armR.rotation.x = sw * 0.8; }
    a.g.position.y = this.baseY + Math.abs(Math.sin(this.walk)) * Math.min(1, this.speed/3) * 0.06;
    // bobber
    const showBob = this.fishing && this.bobState !== 'none';
    this.bob.visible = showBob; this.line.visible = showBob;
    if (showBob){
      if (this.flying){
        const f = this.flying; f.t += dt / f.dur; const k = Math.min(1, f.t);
        this.bob.position.lerpVectors(f.from, f.to, k); this.bob.position.y += Math.sin(k * Math.PI) * f.h;
        if (k >= 1){ this.flying = null; this.bobState = 'water'; ripple(f.to.x, f.to.z); if (f.done) f.done(); }
      } else {
        const wy = waterY(this.bobPos.x, this.bobPos.z, t);
        this.bob.position.set(this.bobPos.x, wy - this.dip * 0.16 + Math.sin(t*3)*0.01, this.bobPos.z);
      }
      // line
      const tip = new THREE.Vector3(); a.tip.getWorldPosition(tip);
      const B = this.bob.position; const arr = this.line.geometry.attributes.position.array;
      const dist = tip.distanceTo(B); const sag = this.flying ? 0.05 : (0.35 - this.bend*0.3) * Math.min(1, dist/4);
      for (let i = 0; i < LINE_PTS; i++){ const k = i/(LINE_PTS-1); arr[i*3] = tip.x + (B.x - tip.x)*k; arr[i*3+1] = tip.y + (B.y + 0.1 - tip.y)*k - Math.sin(k*Math.PI)*sag; arr[i*3+2] = tip.z + (B.z - tip.z)*k; }
      this.line.geometry.attributes.position.needsUpdate = true;
    }
    if (!this.bub.hidden && now() > this.bubUntil) this.bub.hidden = true;
  }
  placeTag(){
    const v = tmpV.set(this.pos.x, this.pos.y + 1.95, this.pos.z);
    const d = camera.position.distanceTo(v);

    this.tag.style.opacity = d > 30 ? String(clamp(1 - (d-30)/15, 0, 1)) : '1';
  }
}

/* ================= MUSIC：程式即時演奏的海島背景音樂 ================= */
const MUSIC = (() => {
  let master = null, timer = null, next = 0, step = 0, sea = null, mel = 4, section = 0;
  const SPB = 60 / 84 / 2; // 每個八分音符的秒數（每分鐘 84 拍）
  const PROGS = [
    [[48,52,55,60],[45,48,52,57],[41,45,48,53],[43,47,50,55]],   // C  Am F  G
    [[41,45,48,53],[43,47,50,55],[48,52,55,60],[45,48,52,57]],   // F  G  C  Am
    [[48,52,55,60],[40,43,47,52],[41,45,48,53],[43,47,50,55]]    // C  Em F  G
  ];
  const PENT = [60,62,64,67,69,72,74,76,79];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, cut){
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = type; o.frequency.value = hz(m); f.type = 'lowpass'; f.frequency.value = cut || 2400;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function seaStart(){
    const len = actx.sampleRate * 4, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0); let b = 0;
    for (let i = 0; i < len; i++){ b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; }
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
    const g = actx.createGain(); g.gain.value = 0.22;
    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 0.11; lg.gain.value = 0.16;
    lfo.connect(lg); lg.connect(g.gain); src.connect(f); f.connect(g); g.connect(master); src.start(); lfo.start(); sea = { src, lfo };
  }
  function tick(){
    if (!actx || !master) return;
    if (next < actx.currentTime - 0.1) next = actx.currentTime + 0.05; // 分頁切回來時不要一次補一大堆音
    while (next < actx.currentTime + 0.3){
      const bar = Math.floor(step / 8), beat = step % 8, t = next;
      if (beat === 0 && bar % 8 === 0) section = Math.floor(Math.random() * PROGS.length);
      const ch = PROGS[section][bar % 4];
      if (beat === 0) note(ch[0] - 12, t, SPB * 7, 'sine', 0.2, 500);
      if (beat === 4) note(ch[0] - 5, t, SPB * 3.5, 'sine', 0.1, 500);
      const arp = [0,2,1,3,2,1,3,2][beat];
      note(ch[arp] + 12, t, SPB * 2.4, 'triangle', 0.055, 2400);
      if (beat % 2 === 0 && Math.random() < (bar % 8 < 4 ? 0.55 : 0.4)){
        mel = clamp(mel + [-2,-1,-1,0,1,1,2][Math.floor(Math.random() * 7)], 0, PENT.length - 1);
        note(PENT[mel] + 12, t, SPB * (Math.random() < 0.3 ? 3.6 : 1.8), 'sine', 0.05, 3200);
      }
      next += SPB; step++;
    }
  }
  return {
    start(){ if (!actx || master) return; master = actx.createGain(); master.gain.value = 0.0001; master.connect(actx.destination); master.gain.exponentialRampToValueAtTime(0.4, actx.currentTime + 2.5); next = actx.currentTime + 0.1; seaStart(); timer = setInterval(tick, 100); },
    stop(){ if (!master) return; clearInterval(timer); const m = master, s = sea; m.gain.setTargetAtTime(0.0001, actx.currentTime, 0.25); setTimeout(() => { try { s && s.src.stop(); s && s.lfo.stop(); m.disconnect(); } catch(e){} }, 1500); master = null; sea = null; },
    playing(){ return !!master; }
  };
})();

    const R = el.offsetWidth / 2; M = R * 0.72;
    cx = clamp(e.clientX, R + 4, innerWidth - R - 4); cy = clamp(e.clientY, R + 4, innerHeight - R - 4);
    el.style.left = (cx - R) + 'px'; el.style.top = (cy - R) + 'px'; el.style.bottom = 'auto'; el.classList.add('active');
    move(e);
  });
  zone.addEventListener('pointermove', e => { if (e.pointerId === id) move(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; joy.x = joy.z = 0; knob.style.transform = ''; el.style.left = el.style.top = el.style.bottom = ''; el.classList.remove('active'); };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end); zone.addEventListener('lostpointercapture', end);
  function move(e){ let dx = e.clientX - cx, dy = e.clientY - cy; const L = Math.hypot(dx, dy); if (L > M){ dx *= M/L; dy *= M/L; } knob.style.transform = `translate(${dx}px,${dy}px)`; joy.x = dx / M; joy.z = dy / M; }
})();

function nearestSpot(){ let best = null, bd = 1e9; for (const s of SPOTS){ const d = Math.hypot(me.pos.x - s.pos.x, me.pos.z - s.pos.z); if (d < bd){ bd = d; best = s; } } return { spot: best, d: bd }; }

function updatePlayer(dt){
  let ix = 0, iz = 0;
  if (!uiBlocked){
    if (keys.KeyW || keys.ArrowUp) iz -= 1; if (keys.KeyS || keys.ArrowDown) iz += 1;
    if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
    ix += joy.x; iz += joy.z;
  }
  const L = Math.hypot(ix, iz); if (L > 1){ ix /= L; iz /= L; }
  const locked = F.phase === 'bite' || F.phase === 'reeling' || F.phase === 'landing';
  let speed = 0;
  if (L > 0.08 && !locked){
    if (F.phase !== 'idle') cancelFishing('收竿了');
    const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw); const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
    const mx = fx * -iz + rx * ix, mz = fz * -iz + rz * ix;
    const run = keys.ShiftLeft || keys.ShiftRight || L > 0.95;
    speed = (run ? 6.2 : 4.2) * Math.min(1, L);
    const nx = me.pos.x + mx / Math.max(1e-6, Math.hypot(mx, mz)) * speed * dt;
    const nz = me.pos.z + mz / Math.max(1e-6, Math.hypot(mx, mz)) * speed * dt;
    if (walkable(nx, me.pos.z) && !blocked(nx, me.pos.z, 0.35)) me.pos.x = nx;
    if (walkable(me.pos.x, nz) && !blocked(me.pos.x, nz, 0.35)) me.pos.z = nz;
    const target = Math.atan2(mx, mz);
    me.rot = lerpAngle(me.rot, target, 1 - Math.exp(-14 * dt));
  }
  me.speed += (speed - me.speed) * Math.min(1, dt * 12);
  const gy = groundHeight(me.pos.x, me.pos.z); me.baseY += (gy - me.baseY) * Math.min(1, dt * 14);
}
function lerpAngle(a, b, k){ let d = ((b - a + Math.PI) % (Math.PI*2)); if (d < 0) d += Math.PI*2; return a + (d - Math.PI) * k; }

function updateCamera(dt){
  const target = tmpV.set(me.pos.x, me.pos.y + 1.3, me.pos.z);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const want = new THREE.Vector3(target.x + Math.sin(cam.yaw)*cp*cam.dist, target.y + sp*cam.dist, target.z + Math.cos(cam.yaw)*cp*cam.dist);
  want.y = Math.max(want.y, 0.8);
  camera.position.lerp(want, 1 - Math.exp(-10 * dt));
  camera.lookAt(target);
}

/* ================= FISHING ================= */
const F = { phase:'idle', spot:null, charge:0, chargeT:0, waitUntil:0, nibbleAt:0, biteUntil:0, fish:null, weight:0, T:0.3, P:0.3, hold:false, surge:0, seed:0, castCharge:0 };
const bigMsg = $('#bigMsg');
let bigTimer = 0;
function flash(text, secs){ bigMsg.textContent = text; bigMsg.hidden = false; bigMsg.classList.remove('pop'); void bigMsg.offsetWidth; bigMsg.classList.add('pop'); clearTimeout(bigTimer); bigTimer = setTimeout(() => bigMsg.hidden = true, (secs || 1.2) * 1000); }

function actionDown(){
  if (uiBlocked) return;
  ensureAudio();
  const act = $('#act'); act.classList.add('down');
  if (F.phase === 'idle'){
    const { spot, d } = nearestSpot(); if (d > 1.7) return;
    F.spot = spot; F.phase = 'charging'; F.chargeT = 0;
    me.rot = Math.atan2(spot.dir.x, spot.dir.y); me.fishing = true; me.bobState = 'none';
  } else if (F.phase === 'waiting'){
    cancelFishing('收竿了');
  } else if (F.phase === 'bite'){
    startReel(); F.hold = true;
  } else if (F.phase === 'reeling'){
    F.hold = true;
  }
}
function actionUp(){
  $('#act').classList.remove('down');
  if (F.phase === 'charging') doCast();
  else if (F.phase === 'reeling') F.hold = false;
}
function doCast(){
  const s = F.spot; const c = F.charge; F.castCharge = c;
  const dist = 3 + c * 4.5;
  const to = new THREE.Vector3(s.pos.x + s.dir.x*dist + rand(-0.4,0.4), 0.12, s.pos.z + s.dir.y*dist + rand(-0.4,0.4));
  const from = new THREE.Vector3(); me.av.tip.getWorldPosition(from);
  me.bobPos.copy(to); me.bobState = 'fly';
  me.flying = { from, to, t:0, dur: 0.55 + c*0.25, h: 1.4 + c*1.4, done(){ SFX.plop(); } };
  F.phase = 'waiting'; F.waitUntil = now() + 0.8 + rand(2.4, 6.5) - c * 0.8; F.nibbleAt = now() + 1.2 + Math.random()*1.5;
  SFX.cast(); pushPresence(true);
}
function cancelFishing(msg){
  F.phase = 'idle'; F.hold = false; me.fishing = false; me.bobState = 'none'; me.flying = null; me.dip = 0; me.bend = 0;
  if (msg && msg !== '收竿了') flash(msg);
  pushPresence(true);
}
function pickFish(spot, charge){
  const list = FISH.filter(f => f.spot === spot.id);
  const w = list.map(f => f.rarity === '常見' ? 1 : f.rarity === '稀有' ? 0.34 * (1 + charge*0.8) : 0.07 * (1 + charge*1.6));
  let r = Math.random() * w.reduce((a,b) => a+b, 0);
  for (let i = 0; i < list.length; i++){ r -= w[i]; if (r <= 0) return list[i]; }
  return list[0];
}
function startReel(){
  F.phase = 'reeling'; F.T = 0.35; F.P = 0.3; F.surge = 0; F.seed = Math.random()*10;
  me.say('!', 'alert', 0.6);
  $('#fhName').textContent = F.fish.rarity === '傳說' ? '超大的拉力！' : F.fish.rarity === '稀有' ? '好重的手感！' : '有魚上鉤了！';
  pushPresence(true);
}
function updateFishing(dt, t){
  const act = $('#act');
  if (F.phase === 'charging'){
    F.chargeT += dt; F.charge = 1 - Math.abs(((F.chargeT / 1.3) % 2) - 1);
    $('#chargeFill').style.width = (F.charge*100).toFixed(1) + '%';
    me.bend = F.charge * 1.5;
  }
  if (F.phase === 'waiting' && !me.flying){
    me.bend *= 0.9;
    if (t > F.nibbleAt && t < F.waitUntil - 0.6){ me.dip = 0.35; ripple(me.bobPos.x, me.bobPos.z); F.nibbleAt = t + 0.9 + Math.random()*1.6; }
    me.dip *= Math.pow(0.02, dt);
    if (t > F.waitUntil){
      F.fish = pickFish(F.spot, F.castCharge); F.weight = +(F.fish.min + (F.fish.max - F.fish.min) * Math.pow(Math.random(), 1.7)).toFixed(2);
      F.phase = 'bite'; F.biteUntil = t + (F.fish.rarity === '傳說' ? 0.8 : F.fish.rarity === '稀有' ? 0.95 : 1.15);
      me.say('!', 'alert', 1); SFX.bite(); ripple(me.bobPos.x, me.bobPos.z, true); pushPresence(true);
    }
  }
  if (F.phase === 'bite'){
    me.dip = 0.9 + Math.sin(t*30)*0.1;
    if (t > F.biteUntil){ me.dip = 0; F.phase = 'waiting'; F.waitUntil = t + rand(2.5, 5.5); F.nibbleAt = t + 1; flash('魚跑掉了', 1); SFX.fail(); pushPresence(true); }
  }
  if (F.phase === 'reeling'){
    const p = F.fish.power;
    let pull = p * (0.55 + 0.45 * Math.sin(t*2.3 + F.seed) * Math.sin(t*0.7 + F.seed*2));
    if (F.surge > 0){ F.surge -= dt; pull += 0.55 * p; } else if (Math.random() < dt * 0.3 * p){ F.surge = rand(0.4, 0.9); }
    const inZone = F.T > 0.35 && F.T < 0.8;
    if (F.hold){ F.T += (0.42 + pull*0.9) * dt; F.P += (0.26 + (inZone ? 0.1 : 0)) * (1.15 - p*0.35) * dt; }
    else { F.T -= 0.75 * dt; F.T += pull * 0.12 * dt; F.P -= (0.03 + pull*0.03) * dt; }
    F.T = Math.max(0, F.T);
    me.bend = clamp(F.T, 0, 1); me.dip = 0.5 + pull*0.4;
    // bobber drifts toward player with progress
    const s = F.spot; const dist = 1.4 + (1 - F.P) * (2 + F.castCharge*4.5);
    const tx = s.pos.x + s.dir.x*dist + Math.sin(t*3 + F.seed)*0.5*(1-F.P), tz = s.pos.z + s.dir.y*dist + Math.cos(t*2.4)*0.5*(1-F.P);
    me.bobPos.x += (tx - me.bobPos.x) * Math.min(1, dt*3); me.bobPos.z += (tz - me.bobPos.z) * Math.min(1, dt*3);
    if (Math.random() < dt * 4) ripple(me.bobPos.x, me.bobPos.z);
    $('#tFill').style.width = (clamp(F.T,0,1)*100).toFixed(1) + '%';
    $('#tBar').classList.toggle('hot', F.T > 0.8);
    $('#fhT').textContent = F.T > 0.8 ? '線快斷了！放開！' : F.T < 0.35 ? '太鬆了，按住拉' : '很好，保持住';
    $('#pFill').style.width = (clamp(F.P,0,1)*100).toFixed(1) + '%';
    $('#fhP').textContent = Math.round(clamp(F.P,0,1)*100) + '%';
    if (F.T >= 1){ SFX.fail(); flash('線斷了！', 1.4); cancelFishing(); }
    else if (F.P <= 0){ SFX.fail(); flash('魚掙脫了', 1.4); cancelFishing(); }
    else if (F.P >= 1){ landFish(); }
  }
  // HUD + button
  $('#chargeHud').hidden = F.phase !== 'charging';
  $('#fishHud').hidden = F.phase !== 'reeling';
  let label, sub = '', cls = '';
  const near = nearestSpot();
  if (F.phase === 'idle'){ if (near.d < 1.7){ label = '拋竿'; sub = isTouch ? '按住蓄力' : '按住空白鍵'; } else { label = '走到釣點'; cls = 'idle'; } }
  else if (F.phase === 'charging'){ label = '放開'; sub = '拋出去'; }
  else if (F.phase === 'waiting'){ label = '等待中'; sub = '點一下收竿'; cls = 'idle'; }
  else if (F.phase === 'bite'){ label = '提竿！'; cls = 'bite'; }
  else if (F.phase === 'reeling'){ label = '拉線'; sub = '按住 / 放開'; }
  else { label = '…'; cls = 'idle'; }
  const html = label + (sub ? `<small>${sub}</small>` : '');
  if (act._h !== html){ act.innerHTML = html; act._h = html; }
  const c = 'act-' + cls; if (act._c !== c){ act.classList.remove('idle','bite'); if (cls) act.classList.add(cls); act._c = c; }
  // spot card
  const card = $('#spotCard');
  const showCard = near.d < 3.2 && F.phase !== 'reeling' && F.phase !== 'charging';
  if (showCard && card._s !== near.spot.id){
    card._s = near.spot.id; $('.t', card).textContent = near.spot.label; $('.s', card).textContent = near.spot.subtitle;
    const fl = $('.fl', card); fl.textContent = '';
    FISH.filter(f => f.spot === near.spot.id).forEach(f => { const c = document.createElement('span'); const known = rec.count[f.id] > 0; c.className = 'chip r-' + f.rarity; c.textContent = (known ? f.name : '？？？') + '・' + f.rarity; fl.appendChild(c); });
  }
  if (!showCard) card._s = null;
  card.hidden = !showCard;
}
function landFish(){
  F.phase = 'landing'; F.hold = false; me.bobState = 'none'; me.dip = 0; me.bend = 0.2;
  const f = F.fish, w = F.weight;
  const from = me.bobPos.clone(); from.y = 0.1;
  const fm = fishModel(f, clamp(0.5 + Math.log(1 + w) * 0.35, 0.5, 1.8)); fm.position.copy(from); scene.add(fm);
  const to = new THREE.Vector3(me.pos.x, me.pos.y + 2.4, me.pos.z);
  jumpers.push({ m: fm, from, to, t: 0 });
  ripple(from.x, from.z, true); SFX.catch();
  setTimeout(() => { me.fishing = false; F.phase = 'result'; const res = recordCatch(f, w); showCatch(f, w, res); announceCatch(f, w, F.spot.id); pushPresence(true); }, 900);
}
const jumpers = [];
function updateJumpers(dt, t){
  for (let i = jumpers.length - 1; i >= 0; i--){
    const j = jumpers[i]; j.t += dt;
    const k = Math.min(1, j.t / 0.9);
    j.m.position.lerpVectors(j.from, j.to, k); j.m.position.y += Math.sin(k*Math.PI) * 1.6;
    j.m.rotation.z = Math.sin(t*14) * 0.4; j.m.rotation.y += dt * 4;
    if (j.t > 2.6){ scene.remove(j.m); jumpers.splice(i, 1); }
  }
}

/* ================= RECORDS / COLLECTION ================= */
function emptyRec(){ return { total:0, bestW:0, bestFish:null, best:{}, count:{}, tank:[], legend:0, updatedAt:0 }; }
function normRec(r){
  const e = emptyRec(); if (!r || typeof r !== 'object') return e;
  e.total = Number(r.total) || 0; e.bestW = Number(r.bestW) || 0; e.bestFish = FISH_BY_ID[r.bestFish] ? r.bestFish : null; e.legend = Number(r.legend) || 0; e.updatedAt = Number(r.updatedAt) || 0;
  for (const f of FISH){ if (r.best && Number(r.best[f.id]) > 0) e.best[f.id] = Number(r.best[f.id]); if (r.count && Number(r.count[f.id]) > 0) e.count[f.id] = Number(r.count[f.id]); }
  if (Array.isArray(r.tank)) e.tank = r.tank.filter(x => x && FISH_BY_ID[x.f]).slice(0, 24).map(x => ({ f:x.f, w:Number(x.w)||0, t:Number(x.t)||0 }));
  return e;
}
let rec = normRec(LS.get('tide.rec', null));
function recordCatch(f, w){
  const isNew = !rec.count[f.id]; const isBest = w > (rec.best[f.id] || 0);
  rec.total++; rec.count[f.id] = (rec.count[f.id] || 0) + 1; if (isBest) rec.best[f.id] = w;
  const isTop = w > rec.bestW; if (isTop){ rec.bestW = w; rec.bestFish = f.id; }
  if (f.rarity === '傳說') rec.legend++;
  rec.tank.unshift({ f: f.id, w, t: Date.now() }); rec.tank = rec.tank.slice(0, 24);
  rec.updatedAt = Date.now();
  LS.set('tide.rec', rec); saveRemote(); buildTank();
  return { isNew, isBest: isBest && !isNew };
}

function shade(hex, amt){ const c = new THREE.Color(hex); if (amt < 0) c.lerp(new THREE.Color('#000'), -amt); else c.lerp(new THREE.Color('#fff'), amt); return '#' + c.getHexString(); }

  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H); ctx.save(); ctx.translate(W*0.52, H/2);

  ctx.fillStyle = shade(c, -0.18); ctx.beginPath(); ctx.moveTo(-W*0.24, 0); ctx.lineTo(-W*0.44, -H*0.3); ctx.quadraticCurveTo(-W*0.38, 0, -W*0.44, H*0.3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-W*0.05, -H*0.2); ctx.quadraticCurveTo(W*0.02, -H*0.44, W*0.12, -H*0.2); ctx.fill();
  ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, W*0.32, H*0.26, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.ellipse(W*0.02, H*0.09, W*0.22, H*0.09, 0, 0, Math.PI*2); ctx.fill();
  if (known){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W*0.19, -H*0.05, H*0.075, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#173247'; ctx.beginPath(); ctx.arc(W*0.205, -H*0.05, H*0.04, 0, Math.PI*2); ctx.fill(); }
  else { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = `bold ${Math.round(H*0.34)}px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, H*0.02); }

}
function fishCanvas(f, known, w, h){ const cv = document.createElement('canvas'); cv.width = w*2; cv.height = h*2; drawFish(cv, f.color, known, f.id); return cv; }
function drawMarlin(cv, known){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H); ctx.save(); ctx.translate(W*0.5, H*0.55); ctx.scale(0.9, 0.9);
  const dark = known ? '#1f3f8f' : '#a9bac4', fin = known ? '#1a3478' : '#9fb1bc', belly = known ? '#d6dee8' : '#c9d5db';

  ctx.fillStyle = fin; ctx.beginPath(); ctx.moveTo(-W*0.3, 0); ctx.quadraticCurveTo(-W*0.36, -H*0.18, -W*0.46, -H*0.36); ctx.quadraticCurveTo(-W*0.4, -H*0.1, -W*0.39, 0); ctx.quadraticCurveTo(-W*0.4, H*0.1, -W*0.46, H*0.34); ctx.quadraticCurveTo(-W*0.36, H*0.17, -W*0.3, 0); ctx.fill();

  ctx.fillStyle = fin; ctx.beginPath(); ctx.moveTo(W*0.13, H*0.06); ctx.lineTo(-W*0.08, H*0.3); ctx.lineTo(W*0.06, H*0.08); ctx.closePath(); ctx.fill();
  if (known){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W*0.2, -H*0.03, H*0.05, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#10203a'; ctx.beginPath(); ctx.arc(W*0.207, -H*0.03, H*0.028, 0, Math.PI*2); ctx.fill(); }
  else { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = `bold ${Math.round(H*0.3)}px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', -W*0.02, H*0.02); }
  ctx.restore();

let tankFish = [];
function buildTank(){
  if (!tankGroup) return;
  for (const t of tankFish) tankGroup.remove(t.m); tankFish = [];
  rec.tank.slice(0, 12).forEach((x, i) => {
    const f = FISH_BY_ID[x.f]; const m = fishModel(f, f.id === 'marlin' ? 0.36 : 0.26 + Math.min(0.14, Math.log(1 + x.w) * 0.05));
    tankGroup.add(m); tankFish.push({ m, ph: i*1.7 + Math.random(), sp: rand(0.35, 0.7), y: rand(-0.45, 0.55), rx: rand(1.1, 1.45), rz: rand(0.45, 0.65) });
  });
}
buildTank();
function updateTank(t){ for (const f of tankFish){ const a = t*f.sp + f.ph; f.m.position.set(Math.cos(a)*f.rx, f.y + Math.sin(a*2)*0.08, Math.sin(a)*f.rz); f.m.rotation.y = -Math.atan2(Math.cos(a)*f.rz, -Math.sin(a)*f.rx); f.m.userData.tail.rotation.y = Math.sin(t*8 + f.ph)*0.4; } }

function isHex(s){ return typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s); }
function applyPeer(pp){
  if (pp.isMe || pp.kind !== 'viewer') return;
  let p = peers.get(pp.peer); const pr = pp.presence || {};
  const pos = Array.isArray(pr.p) ? pr.p : null;

    const f = new Fisher({ shirt: isHex(pr.sh) ? pr.sh : '#9fb3bf', hat: isHex(pr.ht) ? pr.ht : '#ffd36a', name:'' });
    f.pos.set(+pos[0]||0, 0, +pos[1]||0); f.rot = +pr.r || 0;
    p = { fisher: f, by: pp.by, target: new THREE.Vector3(+pos[0]||0, 0, +pos[1]||0), rot: +pr.r || 0, y:+pos[2]||0, lastEmote: 0, pres: pr, guest: pp.guest };

  p.fisher.setName(peerName(p) + (pp.guest ? '・訪客' : ''));

  p.fisher.fishing = !!fi;

    const nb = new THREE.Vector3(clamp(+fi.b[0]||0,-36,36), 0.12, clamp(+fi.b[1]||0,-36,36));
    if (p.fisher.bobState === 'none'){ const from = new THREE.Vector3(); p.fisher.av.tip.getWorldPosition(from); p.fisher.bobPos.copy(nb); p.fisher.bobState = 'fly'; p.fisher.flying = { from, to: nb.clone(), t:0, dur:0.6, h:1.8 }; }

}
function updatePeers(dt, t){
  for (const p of peers.values()){
    const f = p.fisher; const dx = p.target.x - f.pos.x, dz = p.target.z - f.pos.z; const d = Math.hypot(dx, dz);
    if (d > 8){ f.pos.x = p.target.x; f.pos.z = p.target.z; }
    else { const k = 1 - Math.exp(-8*dt); f.pos.x += dx*k; f.pos.z += dz*k; }
    f.speed += ((d > 0.05 ? Math.min(6, d*8) : 0) - f.speed) * Math.min(1, dt*8);
    f.rot = lerpAngle(f.rot, p.rot, 1 - Math.exp(-10*dt));
    f.baseY += (p.y - f.baseY) * Math.min(1, dt*10);
    f.dip = p.ph === 'bite' ? 0.9 + Math.sin(t*30)*0.1 : p.ph === 'reel' ? 0.5 + Math.sin(t*7)*0.2 : f.dip * Math.pow(0.05, dt);
    f.bend = p.ph === 'reel' ? 0.55 + Math.sin(t*5)*0.25 : f.bend * 0.9;
    f.update(dt, t); f.placeTag();
  }
}

    const ul = el('ul', 'people');
    const add = (name, color, st, isMe) => { const li = el('li'); const sw = el('span', 'sw'); sw.style.background = color; li.append(sw, el('span', '', name + (isMe ? '（你）' : '')), el('span', 'st', st)); ul.appendChild(li); };
    const stOf = (ph, x, z) => { if (ph){ const s = SPOTS.reduce((a, b) => Math.hypot(x-a.pos.x, z-a.pos.z) < Math.hypot(x-b.pos.x, z-b.pos.z) ? a : b); return `在${s.short}釣魚中`; } return '散步中'; };
    add(myDisplayName() === '你' ? '你' : myDisplayName(), look.shirt, stOf(me.fishing, me.pos.x, me.pos.z), true);
    for (const p of peers.values()) add(peerName(p) + (p.guest ? '・訪客' : ''), isHex(p.pres.sh) ? p.pres.sh : '#9fb3bf', stOf(!!p.pres.f, p.target.x, p.target.z));
    for (const n of npcs) add(n.nm.textContent, n.av.shirtM.color.getStyle(), '在岸邊釣魚（NPC）');
    body.appendChild(ul);
  } else if (curTab === 'style'){
    const f1 = el('div', 'field'); f1.appendChild(el('label', '', '衣服顏色')); const s1 = el('div', 'swatches');
    SHIRTS.forEach(c => { const b = el('button'); b.style.background = c; b.setAttribute('aria-label', '衣服 ' + c); b.setAttribute('aria-pressed', String(look.shirt === c)); b.addEventListener('click', () => { look.shirt = c; saveLook(); renderTab(); }); s1.appendChild(b); });
    f1.appendChild(s1); body.appendChild(f1);
    const f2 = el('div', 'field'); f2.appendChild(el('label', '', '帽子顏色')); const s2 = el('div', 'swatches');
    HATS.forEach(c => { const b = el('button'); b.style.background = c; b.setAttribute('aria-label', '帽子 ' + c); b.setAttribute('aria-pressed', String(look.hat === c)); b.addEventListener('click', () => { look.hat = c; saveLook(); renderTab(); }); s2.appendChild(b); });
    f2.appendChild(s2); body.appendChild(f2);
    const f3 = el('div', 'field'); const lab = el('label', '', '暱稱'); lab.htmlFor = 'nickIn'; f3.appendChild(lab);
    const inp = el('input', 'txt'); inp.id = 'nickIn'; inp.maxLength = 16; inp.value = nickname; inp.placeholder = (myId && profileNames[myId]) || '留空就用你的 claude.ai 名字';
    inp.addEventListener('change', () => { nickname = inp.value.trim().slice(0, 16); LS.set('tide.nick', nickname); refreshMyName(); pushPresence(true); });
    f3.appendChild(inp); f3.appendChild(el('p', 'sub', '其他玩家會在你頭上看到這個名字。'));
    body.appendChild(f3);
  } else if (curTab === 'help'){
    body.appendChild(el('p', 'sub', '走進任一個發光圈就能釣魚。每個釣點有 4 種魚，其中 1 種是傳說魚。'));
    const k = el('div', 'kbd');
    [['移動', isTouch ? '左下搖桿' : 'WASD / 方向鍵（Shift 跑步）'], ['轉視角', isTouch ? '在畫面上拖曳' : '拖曳滑鼠・滾輪縮放'], ['拋竿', '按住蓄力，放開拋出；拋越遠越容易遇到稀有魚'], ['提竿', '浮標猛沉、出現「!」時馬上按'], ['拉線', '按住收線、放開卸力，讓拉力停在綠色區'], ['聊天', isTouch ? '💬 按鈕' : 'Enter'], ['表情', isTouch ? '右下表情按鈕' : '1 / 2 / 3'], ['音樂', '右上角音符按鈕開關背景音樂（喇叭按鈕是音效）']].forEach(([a, b]) => { k.appendChild(el('kbd', '', a)); k.appendChild(el('span', '', b)); });
    body.appendChild(k);
  }
}
function pjBox(){
  const box = el('div', 'field');
  if (room && pjMode){
    box.appendChild(el('label', '', '房間代碼'));
    const code = el('div', ''); code.style.cssText = 'font-family:var(--f-display);font-size:34px;letter-spacing:.3em;color:var(--sea)'; code.textContent = room.code || ''; box.appendChild(code);
    box.appendChild(el('p', 'sub', '把這 5 個字母，或下面的連結傳給朋友。朋友在「玩家」分頁輸入代碼，或直接點連結就能進來。開房的人關掉頁面，大家就會斷線。'));
    const row = el('div', ''); row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
    const share = el('button', 'pbtn', '分享連結'); share.style.cssText = 'margin:0;width:auto;padding:10px 16px';
    share.addEventListener('click', async () => { const url = location.href.split('#')[0] + '#room=' + room.code; try { if (navigator.share) await navigator.share({ title:'潮汐釣魚村', text:'來一起釣魚！房間代碼 ' + room.code, url }); else { await navigator.clipboard.writeText(url); toast('已複製連結'); } } catch(e){} });
    const leave = el('button', 'pbtn', '離開房間'); leave.style.cssText = 'margin:0;width:auto;padding:10px 16px;background:var(--paper-2);color:var(--ink)';
    leave.addEventListener('click', () => { pjLeave(); renderTab(); });
    row.append(share, leave); box.appendChild(row);
    return box;
  }
  box.appendChild(el('p', 'sub', '目前是單人模式。開一個房間，或輸入朋友給的 5 個字母，就能一起釣魚、聊天。先到「造型」分頁取個暱稱，朋友才認得出你。'));
  const host = el('button', 'pbtn', '開新房間'); host.style.marginTop = '0'; host.addEventListener('click', () => pjStart('host'));
  box.appendChild(host);
  const row = el('div', ''); row.style.cssText = 'display:flex;gap:8px;margin-top:12px';
  const inp = el('input', 'txt'); inp.maxLength = 5; inp.placeholder = '房間代碼，例如 KMRTA'; inp.style.cssText = 'flex:1;min-width:0;text-transform:uppercase;letter-spacing:.15em';
  const go = el('button', 'pbtn', '加入'); go.style.cssText = 'margin:0;width:auto;padding:10px 18px';
  go.addEventListener('click', () => { const c = inp.value.toUpperCase().replace(/[^A-Z]/g, ''); if (c.length !== 5) { toast('房間代碼是 5 個英文字母'); return; } pjStart('join', c); });
  row.append(inp, go); box.appendChild(row);
  return box;
}
function saveLook(){ LS.set('tide.look', look); me.setLook(look.shirt, look.hat); pushPresence(true); }

// landscape / fullscreen
const portraitMQ = matchMedia('(orientation: portrait)');
function syncOrient(){ document.body.classList.toggle('portrait', portraitMQ.matches); setTimeout(resize, 120); }
(portraitMQ.addEventListener ? portraitMQ.addEventListener('change', syncOrient) : portraitMQ.addListener(syncOrient)); syncOrient();
addEventListener('orientationchange', () => setTimeout(resize, 250));
const fsEl = document.documentElement;
const canFS = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
if (canFS) $('#fsBtn').classList.add('ok');
async function goLandscape(){
  ensureAudio();
  try { if (!document.fullscreenElement){ await (fsEl.requestFullscreen ? fsEl.requestFullscreen({ navigationUI:'hide' }) : fsEl.webkitRequestFullscreen()); } } catch(e){}
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch(e){}
  setTimeout(() => { if (portraitMQ.matches) toast('這個瀏覽器不能自動轉向，請手動把手機轉成橫向，或關掉螢幕旋轉鎖定。'); }, 700);
}
$('#rotFull').addEventListener('click', goLandscape);
$('#rotate').addEventListener('click', e => { if (e.target.id !== 'rotSkip') goLandscape(); });
$('#rotSkip').addEventListener('click', () => document.body.classList.add('allowPortrait'));
$('#fsBtn').addEventListener('click', () => { if (document.fullscreenElement){ document.exitFullscreen().catch(() => {}); } else goLandscape(); });

// hint
if (isTouch) $('#hintTxt').textContent = '左下搖桿移動・拖曳畫面轉視角・走進發光圈按住按鈕拋竿';
if (LS.get('tide.hintSeen', false)) $('#hint').hidden = true;
$('#hintX').addEventListener('click', () => { $('#hint').hidden = true; LS.set('tide.hintSeen', true); });

/* ================= LOOP ================= */
let last = now(), frameNo = 0;
camera.position.set(0, 5, 17);
function frame(){
  const t = now(); const dt = Math.min(0.05, t - last); last = t; frameNo++;
  updatePlayer(dt); updateFishing(dt, t); me.update(dt, t); updateCamera(dt); me.placeTag();
  updatePeers(dt, t); updateNpcs(dt, t); updateJumpers(dt, t); updateTank(t);
  // water
  for (const w of animWater){ const pos = w.m.geometry.attributes.position; const a = pos.array; const ox = w.m.position.x, oz = w.m.position.z; for (let i = 0; i < a.length; i += 3) a[i+1] = waterY(a[i] + ox, a[i+2] + oz, t) - 0.01; pos.needsUpdate = true; if (frameNo % 2 === 0) w.m.geometry.computeVertexNormals(); }
  for (const s of schools){ s.g.rotation.y += dt * 0.28; s.g.children.forEach((f, i) => { if (f.userData.tail) f.userData.tail.rotation.y = Math.sin(t*7 + i)*0.5; }); }
  for (const l of lanterns) l.material.emissiveIntensity = 1.0 + Math.sin(t*2 + l.position.x) * 0.25;
  if (lhLight) lhLight.material.emissiveIntensity = 2.4 + Math.sin(t*1.5) * 1.2;
  for (const s of SPOTS) if (s.ring) s.ring.material.emissiveIntensity = 1.4 + Math.sin(t*3 + s.pos.x)*0.5;
  for (const c of clouds){ c.g.position.x += c.v * dt; if (c.g.position.x > 70) c.g.position.x = -70; }
  for (const r of ripples){ if (r.t > 1.2){ r.m.visible = false; continue; } r.t += dt; const k = r.t / 1.2; r.m.scale.setScalar((1 + k*7) * r.big); r.m.material.opacity = (1 - k) * 0.8; }
  sun.position.set(me.pos.x + 18, 30, me.pos.z + 14); sun.target.position.set(me.pos.x, 0, me.pos.z);
  placeLabelsUpdate();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
logMsg('', '歡迎來到潮汐釣魚村！走進任一個發光圈就可以拋竿。', true);
initSocial().catch(() => {});
})();
</script>

  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

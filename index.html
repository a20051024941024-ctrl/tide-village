<div id="loadScr" style="position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#8fd3f4,#2f89c7 70%,#1d5f8a);color:#fff;font-family:system-ui,'Noto Sans TC',sans-serif;text-align:center;transition:opacity .45s;touch-action:none">

  <div style="width:min(260px,64vw);height:10px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden"><div id="loadBar" style="width:8%;height:100%;border-radius:6px;background:#fff6c8;transition:width .35s"></div></div>
  <div id="loadTxt" style="font-size:14px;opacity:.95;min-height:20px">正在準備釣具…</div>
</div>
<script>
(function(){ var S = document.getElementById('loadScr'), B = document.getElementById('loadBar'), T = document.getElementById('loadTxt'), gone = false, top = 8;
  window.__loadStep = function(p, t){ if (gone) return; if (p > top){ top = p; B.style.width = Math.min(100, p) + '%'; } if (t && T.textContent !== t) T.textContent = t; };
  window.__loadDone = function(){ if (gone) return; gone = true; B.style.width = '100%'; S.style.opacity = '0'; S.style.pointerEvents = 'none'; setTimeout(function(){ if (S.parentNode) S.parentNode.removeChild(S); }, 500); };
  /* 保險：不管發生什麼事，25 秒後一定掀開（不會把人卡在這個畫面）；遊戲出錯也馬上掀開，才看得到錯誤訊息 */
  setTimeout(window.__loadDone, 25000); addEventListener('error', function(){ setTimeout(window.__loadDone, 300); });
  var n = 0, iv = setInterval(function(){ if (gone || window.__gameStarted){ clearInterval(iv); return; } n++; window.__loadStep(Math.min(30, 8 + n * 2)); }, 400);
})();
</script>

<script>
// 15 秒內 3D 引擎還沒開始，就告訴玩家怎麼辦（通常是網路或 CDN 問題）
setTimeout(function(){ if (!window.__gameStarted){ var d = document.createElement('div'); d.className = 'panel'; d.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px;max-width:320px;text-align:center;z-index:99'; d.textContent = '遊戲載入太久了。請確認網路連線後重新整理；如果是在 LINE 或 Messenger 裡打開，改用 Chrome 開啟試試。'; document.body.appendChild(d); } }, 15000);
</script>
<script>
// 遊戲出錯時把錯誤訊息顯示在畫面上（方便截圖回報）
(function(){ var shown = 0; function show(m){ if (shown++ > 2) return; try { var d = document.getElementById('errBox'); if (!d){ d = document.createElement('div'); d.id = 'errBox'; d.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);max-width:86vw;padding:14px 16px;background:#fff;color:#a3201a;border:2px solid #e8473a;border-radius:12px;font:13px/1.5 sans-serif;z-index:999;white-space:pre-wrap;word-break:break-all'; (document.body || document.documentElement).appendChild(d); d.textContent = '⚠️ 遊戲出錯了，請截圖給作者：\n'; } d.textContent += m + '\n'; } catch(e){} }
  addEventListener('error', function(e){ show((e.message || '錯誤') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno); });
  addEventListener('unhandledrejection', function(e){ var r = e.reason; if (r && /supabase|fetch|network|Load failed/i.test(String(r.message || r))) return; show('Promise: ' + String(r && (r.stack || r.message) || r).slice(0, 300)); }); })();
</script>

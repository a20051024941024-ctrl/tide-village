<!doctype html><html><head><meta charset="utf8"><style>
*{box-sizing:border-box}body{margin:0;background:#12324a;font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;color:#fff;width:1500px}
h1{margin:0;padding:22px 30px 4px;font-size:38px}p.sub{margin:0;padding:0 30px 16px;font-size:22px;color:#bfe1f5}
.w{padding:0 24px}.w img{display:block;width:100%;border-radius:14px;image-rendering:auto}
.l{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 22px;padding:18px 30px 26px;font-size:24px}
.l i{display:inline-block;width:30px;height:30px;border-radius:7px;vertical-align:-6px;margin-right:10px;border:2px solid rgba(255,255,255,.55)}
.l small{display:block;color:#bfe1f5;font-size:19px;margin:2px 0 0 44px}
</style></head><body>
<h1>新主島：哪一片水算哪個釣點</h1><p class="sub">釣點的代號跟村子一樣，魚、圖鑑、紀錄都接得上；上面是北邊</p>
<div class="w"><img src="fish_keep/map.png"></div>
<div class="l">
<div><i style="background:#7fd0ee"></i>海邊（晴潮海邊）<small>岸邊 6 公尺內，沙灘、海岸都算</small></div>
<div><i style="background:#1c5d8c"></i>外海（港口外海）<small>離岸 6 公尺以上，棧橋走到底</small></div>
<div><i style="background:#3fa85a"></i>紅樹林<small>西北河口，站在木棧道上釣</small></div>
<div><i style="background:#ff9a3c"></i>河（月灣河岸）<small>小橋往西到紅樹林這一段</small></div>
<div><i style="background:#e040fb"></i>森林的溪（螢光溪間）<small>小橋往上游、森林裡那一段</small></div>
<div><i style="background:#ffe04a"></i>湖（鏡湖）<small>山上瀑布旁邊的湖</small></div>
</div></body></html>

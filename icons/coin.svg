<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 潮汐釣魚村的金幣：金色硬幣、中間浮雕一條魚、旁邊濺起水花、右上角閃光 -->
  <defs>
    <linearGradient id="cf" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#ffe680"/><stop offset="0.45" stop-color="#ffc21f"/><stop offset="1" stop-color="#f29a0a"/>
    </linearGradient>
    <linearGradient id="ce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e98a06"/><stop offset="1" stop-color="#b85e00"/>
    </linearGradient>
    <linearGradient id="ci" x1="0.2" y1="0.15" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#ffd23a"/><stop offset="1" stop-color="#f7a614"/>
    </linearGradient>
    <linearGradient id="cw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#3fb4ef"/>
    </linearGradient>
  </defs>
  <!-- 水花（後面） -->
  <path d="M7 72c-7-11-4-25 7-31-2 9 0 17 7 22z" fill="url(#cw)" stroke="#2a8fd0" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M94 68c6-10 3-22-6-27 1 8-1 15-7 19z" fill="url(#cw)" stroke="#2a8fd0" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 硬幣厚度 -->
  <ellipse cx="52" cy="54" rx="37" ry="37" fill="url(#ce)"/>
  <!-- 硬幣正面 -->
  <circle cx="48" cy="50" r="37" fill="url(#cf)" stroke="#e08a00" stroke-width="2"/>
  <circle cx="48" cy="50" r="28.5" fill="url(#ci)" stroke="#e8900a" stroke-width="3"/>
  <!-- 浮雕的魚 -->
  <g fill="#f3a00f" stroke="#c96f00" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M62 50l11-9-3 9 3 9z"/>
    <path d="M27 50c5-10 15-14 25-12 6 1 10 6 11 12-1 6-5 11-11 12-10 2-20-2-25-12z"/>
    <path d="M40 39c4-7 12-9 18-6-2 2-3 4-3 6z"/>
    <path d="M44 61c3 5 8 7 12 5-1-2-2-4-2-6z"/>
  </g>
  <g fill="none" stroke="#c96f00" stroke-width="2" stroke-linecap="round">
    <path d="M42 42c3 4 3 12 0 16"/><path d="M48 41c2 5 2 13 0 18"/>
  </g>
  <circle cx="34" cy="48" r="2.6" fill="#7a3d00"/>
  <!-- 亮光 -->
  <path d="M22 34c4-9 13-15 22-16" fill="none" stroke="#fff6c2" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M76 70l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z" fill="#fffbe0"/>
  <!-- 水花（前面） -->
  <path d="M14 82c10 7 30 9 46 7 14-2 24-6 30-11-4 9-16 15-30 17-19 3-38-2-46-13z" fill="url(#cw)" stroke="#2a8fd0" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="13" cy="56" r="2.6" fill="#bff0ff" stroke="#2a8fd0" stroke-width="1"/>
  <circle cx="91" cy="56" r="2.2" fill="#bff0ff" stroke="#2a8fd0" stroke-width="1"/>
  <!-- 右上角閃光 -->
  <g fill="#ffd23f" stroke="#f0a020" stroke-width="1.2" stroke-linejoin="round">
    <path d="M70 6l5 1-3 11-4-1z"/><path d="M84 11l4 3-7 9-3-3z"/><path d="M92 25l2 4-10 4-1-4z"/>
  </g>
</svg>
